<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.20 0.34"/>
        <feFuncG type="table" tableValues="0.20 0.34"/>
        <feFuncB type="table" tableValues="0.20 0.34"/>
        <feFuncA type="table" tableValues="0 0.10"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#404040"/>
      <stop offset="0.55" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#414141"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" fill="url(#base)"/>
  <rect width="320" height="240" filter="url(#grain)" opacity="0.62"/>
</svg>
